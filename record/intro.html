<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Lumina Luxe Photo Studio - Intro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1920px;
      height: 1080px;
      background: #09090b;
      color: #fafaf9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .glow-1 {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.18) 0%, rgba(245, 158, 11, 0) 70%);
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      filter: blur(40px);
      pointer-events: none;
    }
    .grid-pattern {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      border-radius: 9999px;
      background: rgba(24, 24, 27, 0.8);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fcd34d;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.15);
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      background: #f59e0b;
      border-radius: 50%;
      box-shadow: 0 0 10px #f59e0b;
    }
    h1 {
      font-family: "Georgia", "Times New Roman", serif;
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #ffffff 0%, #fef3c7 40%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }
    p.tagline {
      font-size: 22px;
      color: #a8a29e;
      font-weight: 300;
      max-width: 820px;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 40px;
    }
    .features-pill {
      display: flex;
      gap: 28px;
      margin-top: 10px;
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #e7e5e4;
      font-size: 15px;
      font-weight: 500;
      background: rgba(28, 25, 23, 0.6);
      padding: 10px 22px;
      border-radius: 12px;
      border: 1px solid rgba(87, 83, 78, 0.4);
    }
    .feature-icon {
      color: #f59e0b;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="grid-pattern"></div>
  <div class="glow-1"></div>

  <div class="badge">
    <span class="badge-dot"></span>
    Sistem Booking Foto Studio Online
  </div>

  <h1>Lumina Luxe Photo Studio</h1>
  <p class="tagline">Platform Reservasi Jadwal Pemotretan Real-Time, Pembayaran QRIS & DP Otomatis, serta Multi-Role Dashboard</p>

  <div class="features-pill">
    <div class="feature-item">
      <span class="feature-icon">✦</span>
      <span>Katalog Paket & Add-on Interaktif</span>
    </div>
    <div class="feature-item">
      <span class="feature-icon">✦</span>
      <span>Anti Double-Booking Real-Time</span>
    </div>
    <div class="feature-item">
      <span class="feature-icon">✦</span>
      <span>E-Ticket QR & Rekap Finansial</span>
    </div>
  </div>
</body>
</html>
