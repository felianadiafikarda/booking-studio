<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Lumina Luxe Photo Studio - Outro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1920px;
      height: 1080px;
      background: #09090b;
      color: #fafaf9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .glow-1 {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.16) 0%, rgba(245, 158, 11, 0) 70%);
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      filter: blur(50px);
      pointer-events: none;
    }
    .grid-pattern {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }
    h2 {
      font-family: "Georgia", "Times New Roman", serif;
      font-size: 58px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 0%, #fef3c7 40%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }
    p.tagline {
      font-size: 22px;
      color: #d6d3d1;
      font-weight: 300;
      margin-bottom: 36px;
      text-align: center;
    }
    .contacts {
      display: flex;
      align-items: center;
      gap: 32px;
      background: rgba(28, 25, 23, 0.7);
      padding: 16px 36px;
      border-radius: 9999px;
      border: 1px solid rgba(245, 158, 11, 0.35);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 16px;
      color: #fafaf9;
    }
    .contact-icon {
      color: #f59e0b;
      font-size: 18px;
    }
    .divider {
      width: 1px;
      height: 20px;
      background: rgba(120, 113, 108, 0.5);
    }
    .copyright {
      margin-top: 40px;
      font-size: 13px;
      color: #78716c;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="grid-pattern"></div>
  <div class="glow-1"></div>

  <h2>Lumina Luxe Photo Studio</h2>
  <p class="tagline">Solusi Reservasi Studio Foto Modern, Otomatis, & Terintegrasi</p>

  <div class="contacts">
    <div class="contact-item">
      <span class="contact-icon">✆</span>
      <span>WhatsApp: <strong>+62 852-6541-6588</strong></span>
    </div>
    <div class="divider"></div>
    <div class="contact-item">
      <span class="contact-icon">🌐</span>
      <span>Website: <strong>luminafoto.com</strong></span>
    </div>
    <div class="divider"></div>
    <div class="contact-item">
      <span class="contact-icon">📍</span>
      <span>Studio: <strong>Yogyakarta, Indonesia</strong></span>
    </div>
  </div>

  <div class="copyright">
    &copy; 2026 Lumina Luxe Studio. All rights reserved.
  </div>
</body>
</html>
